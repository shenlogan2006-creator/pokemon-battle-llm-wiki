        msgEl.className = "mt-1.5 text-emerald-400 font-semibold";
      } else {
        msgEl.textContent = "✘ 答錯囉！請回顧上一頁的「新手常見誤區」提醒。";
        msgEl.className = "mt-1.5 text-rose-400 font-semibold";
      }
    }

    document.addEventListener("keydown", (e) => {
      if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
        e.preventDefault();
        nextSlide();
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        e.preventDefault();
        prevSlide();
      }
    });

    renderSlide();
  </script>
</body>
</html>
